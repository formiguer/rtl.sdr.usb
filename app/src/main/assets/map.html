<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .plane { background: none; border: none; }
    .plane svg { width: 28px; height: 28px; filter: drop-shadow(0 0 2px #fff); }
    .plane span { position: absolute; left: 22px; top: 2px; font: bold 12px sans-serif;
      background: rgba(255,255,255,.85); padding: 0 3px; border-radius: 3px; white-space: nowrap; }
    .ring { background: none; border: none; }
    .ring span { position: absolute; transform: translate(-50%, -50%); font: bold 11px sans-serif;
      color: #0d47a1; background: rgba(255,255,255,.8); padding: 0 3px; border-radius: 3px; white-space: nowrap; }
    .airport { background: none; border: none; }
    .airport span { position: absolute; left: 12px; top: -8px; font: bold 13px sans-serif;
      background: #0d47a1; color: #fff; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  // Aeropuerto de Palma de Mallorca (LEPA / PMI) — centro de los anillos de distancia.
  var CENTER = [39.5517, 2.7388];
  var RING_STEP_KM = 25;
  var RING_MAX_KM = 250;

  var map = L.map('map', {zoomControl: true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Aeropuerto
  L.circleMarker(CENTER, {radius: 6, color: '#fff', weight: 2, fillColor: '#0d47a1', fillOpacity: 1}).addTo(map);
  L.marker(CENTER, {
    interactive: false,
    icon: L.divIcon({className: 'airport', iconSize: [0, 0], html: '<span>PMI</span>'})
  }).addTo(map);

  // Anillos cada 25 km hasta 250 km, con etiqueta al norte de cada uno
  for (var km = RING_STEP_KM; km <= RING_MAX_KM; km += RING_STEP_KM) {
    var major = km % 50 === 0;
    L.circle(CENTER, {
      radius: km * 1000, color: '#1565c0', weight: major ? 1.6 : 0.8,
      opacity: major ? 0.75 : 0.5, fill: false, interactive: false
    }).addTo(map);
    L.marker([CENTER[0] + km / 111.32, CENTER[1]], {
      interactive: false,
      icon: L.divIcon({className: 'ring', iconSize: [0, 0], html: '<span>' + km + ' km</span>'})
    }).addTo(map);
  }

  // Encuadre inicial: se ve el anillo completo de 250 km
  map.fitBounds(L.circle(CENTER, {radius: RING_MAX_KM * 1000}).getBounds());

  // Distancia en km al aeropuerto (haversine)
  function distKm(lat, lon) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (lat - CENTER[0]) * rad, dLon = (lon - CENTER[1]) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(CENTER[0] * rad) * Math.cos(lat * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  var markers = {};

  var PLANE = '<svg viewBox="0 0 24 24"><path d="M12 2l2.5 7 7.5 4v2l-7.5-2-.5 6 2.5 2v1L12 21l-4.5 1v-1L10 19l-.5-6L2 15v-2l7.5-4z" fill="#c62828" stroke="#fff" stroke-width="1"/></svg>';

  function icon(a) {
    var label = (a.flight || a.hex) + (a.alt != null ? ' ' + Math.round(a.alt / 100) * 100 + 'ft' : '');
    var rot = a.track != null ? a.track : 0;
    return L.divIcon({
      className: 'plane',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      html: '<div style="transform:rotate(' + rot + 'deg)">' + PLANE + '</div><span>' + label + '</span>'
    });
  }

  function popup(a) {
    return '<b>' + (a.flight || a.hex) + '</b><br>ICAO ' + a.hex +
      '<br>Distancia a PMI: ' + distKm(a.lat, a.lon).toFixed(0) + ' km' +
      (a.alt != null ? '<br>Altitud: ' + a.alt + ' ft' : '') +
      (a.speed != null ? '<br>Velocidad: ' + a.speed + ' kt' : '') +
      (a.track != null ? '<br>Rumbo: ' + a.track + '°' : '');
  }

  // Lo llama la app cada segundo con [{hex, flight, lat, lon, alt, speed, track}]
  function updateAircraft(list) {
    var seen = {};
    list.forEach(function (a) {
      if (a.lat == null || a.lon == null) return;
      seen[a.hex] = true;
      if (markers[a.hex]) {
        markers[a.hex].setLatLng([a.lat, a.lon]).setIcon(icon(a)).setPopupContent(popup(a));
      } else {
        markers[a.hex] = L.marker([a.lat, a.lon], {icon: icon(a)}).addTo(map).bindPopup(popup(a));
      }
    });
    Object.keys(markers).forEach(function (hex) {
      if (!seen[hex]) { map.removeLayer(markers[hex]); delete markers[hex]; }
    });
  }
</script>
</body>
</html>
